<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Substitution Tracker</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    #lessons-container { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; }
    .lesson-card { background: #fff; border-radius: 8px; padding: 16px; width: 280px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-bottom: 8px; }
    .tag.kec { background: #e0f2fe; color: #0369a1; }
    .tag.interac { background: #fef3c7; color: #b45309; }
    button { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 8px; }
    button:hover { background: #059669; }
  </style>
</head>
<body>

  <h1>Available Substitute Lessons (LF)</h1>
  <div id="lessons-container">
    <p>Loading active lessons...</p>
  </div>

  <!-- Link your external JS file here -->
  <script src="app.js"></script>
</body>
</html>
